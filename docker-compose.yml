services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webagent}
      POSTGRES_USER: ${POSTGRES_USER:-webagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webagent_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webagent} -d ${POSTGRES_DB:-webagent}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://webagent:webagent_password@postgres:5432/webagent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8010:8000"
    volumes:
      - ./runtime:/app/runtime
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts

  worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "-Q",
        "${AGENT_RUN_QUEUE_NAME:-agent-runs}",
        "--concurrency=${WORKER_CONCURRENCY:-1}",
      ]
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://webagent:webagent_password@postgres:5432/webagent}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_RUN_QUEUE_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime:/app/runtime
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8010}
        NEXT_PUBLIC_API_ADAPTER: ${NEXT_PUBLIC_API_ADAPTER:-fastapi}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8010}
      NEXT_PUBLIC_API_ADAPTER: ${NEXT_PUBLIC_API_ADAPTER:-fastapi}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3002}:3002"

volumes:
  postgres-data:
  redis-data:
