services:
  postgres:
    image: postgres:16
    container_name: webagent_postgres
    environment:
      POSTGRES_USER: webagent
      POSTGRES_PASSWORD: webagent_password
      POSTGRES_DB: webagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: webagent_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

