[project]
name = "webagent-api"
version = "0.1.0"
description = "FastAPI backend for WebAgent."
requires-python = ">=3.11"
dependencies = [
  "agent-runtime @ file:../agent-runtime",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "celery[redis]>=5.3.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "PyMuPDF>=1.24.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.12",
  "redis>=5.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22.0",
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent_runtime", "app"]
